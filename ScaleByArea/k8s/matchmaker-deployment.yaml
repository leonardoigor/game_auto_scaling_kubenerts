apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaker
  template:
    metadata:
      labels:
        app: matchmaker
    spec:
      serviceAccountName: matchmaker-sa
      containers:
        - name: matchmaker
          image: igormendonca/matchmaker:latest
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: MATCHMAKER_PORT
              value: "4000"
            - name: NAMESPACE
              value: "default"
            - name: MAX_PLAYERS_PER_POD
              value: "1"
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaker
spec:
  type: NodePort
  selector:
    app: matchmaker
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      nodePort: 31400
