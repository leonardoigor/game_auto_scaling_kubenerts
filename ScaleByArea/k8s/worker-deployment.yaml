apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: igormendonca/worker:latest
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: TICK_MS
              value: "50"
